name: Test basic pipeline scan results to SARIF conversion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture results.json to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/results.json" "$GITHUB_WORKSPACE/results.json"

      - id: action
        uses: .
        with:
          pipeline-results-json: results.json
          output-results-sarif: veracode-results.sarif

      - name: Assert SARIF file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/veracode-results.sarif" ]; then
            echo "FAIL: SARIF output file was not created"
            exit 1
          fi
          echo "PASS: SARIF file exists"

      - name: Assert SARIF file is valid JSON
        run: |
          jq empty "$GITHUB_WORKSPACE/veracode-results.sarif" || {
            echo "FAIL: SARIF output file is not valid JSON"
            exit 1
          }
          echo "PASS: SARIF file is valid JSON"

      - name: Assert SARIF file has expected version
        run: |
          VERSION=$(jq -r '.version' "$GITHUB_WORKSPACE/veracode-results.sarif")
          echo "SARIF version: $VERSION"
          if [ "$VERSION" != "2.1.0" ]; then
            echo "FAIL: expected SARIF version 2.1.0, got '$VERSION'"
            exit 1
          fi
          echo "PASS: SARIF version is 2.1.0"

      - name: Assert SARIF file contains findings
        run: |
          RESULTS_COUNT=$(jq '.runs[0].results | length' "$GITHUB_WORKSPACE/veracode-results.sarif")
          echo "Results count: $RESULTS_COUNT"
          if [ "$RESULTS_COUNT" -lt 1 ]; then
            echo "FAIL: expected at least 1 result in SARIF output, got $RESULTS_COUNT"
            exit 1
          fi
          echo "PASS: SARIF file contains $RESULTS_COUNT result(s)"
