name: Test pipeline scan results to SARIF conversion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy pipeline results fixture to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/pipeline-results.json" "$GITHUB_WORKSPACE/results.json"

      - id: action
        uses: .
        with:
          scan-type: pipeline
          pipeline-results-json: results.json
          results-json: results.json
          output-results-sarif: veracode-results.sarif
          finding-rule-level: '4:3:0'
          noupload: 'true'

      - name: Assert SARIF file was created
        run: |
          echo "Checking for SARIF output file..."
          if [ ! -f "$GITHUB_WORKSPACE/veracode-results.sarif" ]; then
            echo "FAIL: SARIF output file 'veracode-results.sarif' was not created"
            exit 1
          fi
          echo "PASS: SARIF file exists"

      - name: Assert SARIF file is valid JSON with expected structure
        run: |
          SARIF_FILE="$GITHUB_WORKSPACE/veracode-results.sarif"
          echo "Validating SARIF file content..."

          # Check it is valid JSON
          if ! python3 -c "import json, sys; json.load(open('$SARIF_FILE'))" 2>&1; then
            echo "FAIL: SARIF file is not valid JSON"
            exit 1
          fi
          echo "PASS: SARIF file is valid JSON"

          # Check for SARIF schema version field
          VERSION=$(python3 -c "import json; d=json.load(open('$SARIF_FILE')); print(d.get('version',''))" 2>/dev/null || echo "")
          echo "SARIF version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: SARIF file missing 'version' field"
            exit 1
          fi
          echo "PASS: SARIF version field present: $VERSION"

          # Check for runs array
          RUNS=$(python3 -c "import json; d=json.load(open('$SARIF_FILE')); print(len(d.get('runs',[])))" 2>/dev/null || echo "0")
          echo "SARIF runs count: $RUNS"
          if [ "$RUNS" -lt 1 ]; then
            echo "FAIL: SARIF file has no 'runs' entries"
            exit 1
          fi
          echo "PASS: SARIF runs present"

          # Check for results (findings) in first run
          RESULTS=$(python3 -c "import json; d=json.load(open('$SARIF_FILE')); print(len(d['runs'][0].get('results',[])))" 2>/dev/null || echo "0")
          echo "SARIF results count: $RESULTS"
          if [ "$RESULTS" -lt 1 ]; then
            echo "FAIL: SARIF file has no results/findings"
            exit 1
          fi
          echo "PASS: SARIF results present ($RESULTS findings)"
