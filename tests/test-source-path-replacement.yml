name: Test source base path replacement in SARIF output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy pipeline results fixture to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/pipeline-results.json" "$GITHUB_WORKSPACE/results.json"

      - id: action
        uses: .
        with:
          scan-type: pipeline
          pipeline-results-json: results.json
          results-json: results.json
          output-results-sarif: veracode-path-replaced.sarif
          finding-rule-level: '4:3:0'
          source-base-path-1: 'com/example/:src/main/java/com/example/'
          noupload: 'true'

      - name: Assert SARIF file was created with path replacement
        run: |
          echo "Checking for SARIF output file..."
          if [ ! -f "$GITHUB_WORKSPACE/veracode-path-replaced.sarif" ]; then
            echo "FAIL: SARIF output file 'veracode-path-replaced.sarif' was not created"
            exit 1
          fi
          echo "PASS: SARIF file exists"

      - name: Assert SARIF file is valid JSON
        run: |
          SARIF_FILE="$GITHUB_WORKSPACE/veracode-path-replaced.sarif"
          echo "Validating SARIF file content..."

          if ! python3 -c "import json, sys; json.load(open('$SARIF_FILE'))" 2>&1; then
            echo "FAIL: SARIF file is not valid JSON"
            exit 1
          fi
          echo "PASS: SARIF file is valid JSON"

          # Check for runs array
          RUNS=$(python3 -c "import json; d=json.load(open('$SARIF_FILE')); print(len(d.get('runs',[])))" 2>/dev/null || echo "0")
          echo "SARIF runs count: $RUNS"
          if [ "$RUNS" -lt 1 ]; then
            echo "FAIL: SARIF file has no 'runs' entries"
            exit 1
          fi
          echo "PASS: SARIF runs present"

          # Dump the SARIF content for debugging
          echo "--- SARIF content (truncated) ---"
          python3 -c "import json; d=json.load(open('$SARIF_FILE')); print(json.dumps(d, indent=2)[:2000])"
          echo "--- end ---"
          echo "PASS: source-base-path-1 input accepted and SARIF generated"
