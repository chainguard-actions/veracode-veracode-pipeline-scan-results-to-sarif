name: Test SARIF upload to GitHub (sentinel repo graceful failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy pipeline results fixture to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/pipeline-results.json" "$GITHUB_WORKSPACE/results.json"

      # With noupload=false (default), the action will attempt to upload to GitHub.
      # Under the harness, GITHUB_REPOSITORY is a sentinel that does not exist on GitHub,
      # so the upload API call will fail. We allow this and assert graceful handling.
      - id: action
        uses: .
        continue-on-error: true
        with:
          scan-type: pipeline
          pipeline-results-json: results.json
          results-json: results.json
          output-results-sarif: veracode-upload-test.sarif
          finding-rule-level: '4:3:0'
          noupload: 'false'

      - name: Assert SARIF file was created before upload attempt
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The SARIF file should always be created (conversion happens before upload)
          if [ -f "$GITHUB_WORKSPACE/veracode-upload-test.sarif" ]; then
            echo "PASS: SARIF file was created before upload attempt"
          else
            echo "INFO: SARIF file not found (action may have failed before writing it)"
          fi

          # The action either succeeds (unlikely on sentinel) or fails gracefully on upload
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (upload worked)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully on sentinel repo upload (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
